name: Actualizar datos de futbol

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-24.04

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Descargar ligas principales
        run: |

          TEMPORADAS=("2526" "2627")

          LIGAS=(
            "E0"
            "E1"
            "E2"
            "E3"
            "EC"
            "SC0"
            "SC1"
            "SC2"
            "SC3"
            "D1"
            "D2"
            "I1"
            "I2"
            "SP1"
            "SP2"
            "F1"
            "F2"
            "N1"
            "B1"
            "P1"
            "T1"
            "G1"
          )

          for TEMPORADA in "${TEMPORADAS[@]}"; do

            echo "======================================"
            echo "TEMPORADA: $TEMPORADA"
            echo "======================================"

            mkdir -p "data/$TEMPORADA"

            for LIGA in "${LIGAS[@]}"; do

              echo "--------------------------------------"
              echo "Descargando $LIGA - $TEMPORADA"
              echo "--------------------------------------"

              URL="https://www.football-data.co.uk/mmz4281/${TEMPORADA}/${LIGA}.csv"

              TEMP_FILE="data/${TEMPORADA}/${LIGA}.tmp"
              FINAL_FILE="data/${TEMPORADA}/${LIGA}.csv"

              if curl -fL --retry 3 \
                -A "Mozilla/5.0" \
                "$URL" \
                -o "$TEMP_FILE"; then

                if test -s "$TEMP_FILE"; then
                  mv "$TEMP_FILE" "$FINAL_FILE"
                  echo "OK: $FINAL_FILE"
                else
                  echo "Archivo vacío: $LIGA"
                  rm -f "$TEMP_FILE"
                fi

              else

                echo "No disponible: $LIGA - $TEMPORADA"
                rm -f "$TEMP_FILE"

              fi

            done

          done


      - name: Descargar ligas adicionales
        run: |

          mkdir -p data/extra

          LIGAS_EXTRA=(
            "ARG"
            "AUT"
            "BRA"
            "CHN"
            "DNK"
            "FIN"
            "IRL"
            "JPN"
            "MEX"
            "NOR"
            "POL"
            "ROU"
            "SWE"
            "SWZ"
            "USA"
          )

          for LIGA in "${LIGAS_EXTRA[@]}"; do

            echo "--------------------------------------"
            echo "Descargando liga extra: $LIGA"
            echo "--------------------------------------"

            URL="https://football-data.co.uk/new/${LIGA}.csv"

            TEMP_FILE="data/extra/${LIGA}.tmp"
            FINAL_FILE="data/extra/${LIGA}.csv"

            if curl -fL --retry 3 \
              -A "Mozilla/5.0" \
              "$URL" \
              -o "$TEMP_FILE"; then

              if test -s "$TEMP_FILE"; then
                mv "$TEMP_FILE" "$FINAL_FILE"
                echo "OK: $FINAL_FILE"
              else
                echo "Archivo vacío: $LIGA"
                rm -f "$TEMP_FILE"
              fi

            else

              echo "No disponible actualmente: $LIGA"
              rm -f "$TEMP_FILE"

            fi

          done


      - name: Guardar archivos en GitHub
        run: |

          git config user.name "GitHub Actions"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar datos de fútbol"
            git push
          fi
            git push
          fi

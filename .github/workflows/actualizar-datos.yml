name: Actualizar datos de futbol

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Descargar España La Liga 2026-27
        run: |
          mkdir -p data/2627

          curl -fL --retry 3 \
            -A "Mozilla/5.0" \
            "https://www.football-data.co.uk/mmz4281/2627/SP1.csv" \
            -o data/2627/SP1.csv

          test -s data/2627/SP1.csv

          echo "Archivo descargado correctamente:"
          ls -lh data/2627/SP1.csv

          echo "Encabezado:"
          head -n 1 data/2627/SP1.csv

          grep -q "HomeTeam" data/2627/SP1.csv

      - name: Guardar CSV en GitHub
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/2627/SP1.csv

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en el CSV."
          else
            git commit -m "Actualizar España La Liga 2026-27"
            git push
          fi
